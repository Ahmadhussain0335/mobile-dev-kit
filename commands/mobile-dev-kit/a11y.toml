description = "Accessibility audit of a screen or module against WCAG 2.2 AA with the mobile-accessibility skill. Read-only."
prompt = '''
Audit the accessibility of one screen or module. Do not edit any file.

Target: {{args}}
If the target is empty, ask which screen or module to audit and stop.

1. Activate the `mobile-accessibility` skill and apply it to the target: read the screen's UI code, its
   components, strings and resources.
2. Check labels, roles, touch targets, text scaling, contrast, focus order, motion and announcements, and note
   which checks need a device or screen reader.
3. Return the skill's output format: findings with the WCAG 2.2 success criterion, severity, screen, platform,
   evidence and fix, followed by the manual screen-reader steps still to run.
'''
